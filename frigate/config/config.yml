# Written in 0.18's format. This file is a read-only ConfigMap mount, so
# Frigate can't migrate it itself; the version tells it no migration is due.
version: 0.18-0

# ONNX on homelab's RTX 3070 (the -tensorrt image runs ONNX Runtime with the
# CUDA/TensorRT providers). The model is YOLOv9-s at 320x320, exported with the
# command in Frigate's docs (Object Detectors > ONNX > YOLOv9) and copied to
# /storage/frigate/config/model_cache/ on homelab.
detectors:
  onnx:
    type: onnx

model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolov9-s-320.onnx
  labelmap_path: /labelmap/coco-80.txt



mqtt:
  enabled: False

go2rtc:
  streams:
    telescope:
      - rtsp://stream:xj27c7jo@192.168.8.64:554/Streaming/Channels/101

cameras:
  telescope:
    enabled: true
    ffmpeg:
      hwaccel_args: preset-nvidia
      inputs:
        - path: rtsp://stream:xj27c7jo@192.168.8.64:554/Streaming/Channels/101
          roles:
            - detect
            - record
      input_args: >-
        -avoid_negative_ts make_zero
        -fflags +genpts+discardcorrupt
        -rtsp_transport tcp
        -timeout 5000000
      output_args:
        detect: -f rawvideo -pix_fmt yuv420p
        record: -f segment -segment_time 60 -segment_format mp4 -reset_timestamps 1 -c copy -strftime 1 -strftime_mkdir 1 

    detect:
      enabled: True
      width: 640
      height: 360
      fps: 2

record:
  enabled: True
  alerts:
    retain:
      days: 3
      mode: active_objects
  detections:
    retain:
      days: 3
      mode: active_objects

logger:
  default: info
  logs:
    frigate.video: debug
    frigate.object_detection: info
    frigate.motion: info
    frigate.edgetpu: info