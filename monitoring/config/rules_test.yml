# Unit tests for rules.yml's node_disk group (SME-686). Not in the
# Prometheus config map, so never deployed. Run with the deployed version:
#
#   docker run --rm -v "$PWD/monitoring/config:/c" --entrypoint promtool \
#     prom/prometheus:v3.8.0 test rules /c/rules_test.yml
#
# Instances, as node-exporter reports them (job "kubernetes-pods", the
# pod's name label, host network so instance is <node ip>:9100):
#   .130  /var/lib/rancher at 10% free, / at 50%: alerts on /var/lib/rancher
#   .58   /var/lib/rancher at 40% free, / at 10%: no alert, / isn't where
#         local-path keeps volumes on a node with its own /var/lib/rancher
#   .217  only /, at 10% free: alerts on /
#   .167  only /, at 40% free: no alert
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.130:9100",mountpoint="/var/lib/rancher"}'
        values: '10x40'
      - series: 'node_filesystem_size_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.130:9100",mountpoint="/var/lib/rancher"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.130:9100",mountpoint="/"}'
        values: '50x40'
      - series: 'node_filesystem_size_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.130:9100",mountpoint="/"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.58:9100",mountpoint="/var/lib/rancher"}'
        values: '40x40'
      - series: 'node_filesystem_size_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.58:9100",mountpoint="/var/lib/rancher"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.58:9100",mountpoint="/"}'
        values: '10x40'
      - series: 'node_filesystem_size_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.58:9100",mountpoint="/"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.217:9100",mountpoint="/"}'
        values: '10x40'
      - series: 'node_filesystem_size_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.217:9100",mountpoint="/"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.167:9100",mountpoint="/"}'
        values: '40x40'
      - series: 'node_filesystem_size_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.167:9100",mountpoint="/"}'
        values: '100x40'
      # A router, scraped by the static job: never part of the rule.
      - series: 'node_filesystem_avail_bytes{job="node_exporter_external",instance="192.168.8.1:9100",mountpoint="/"}'
        values: '1x40'
      - series: 'node_filesystem_size_bytes{job="node_exporter_external",instance="192.168.8.1:9100",mountpoint="/"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: LocalPathDiskLow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: kubernetes-pods
              name: node-exporter
              kubernetes_namespace: monitoring
              instance: 192.168.8.130:9100
              mountpoint: /var/lib/rancher
            exp_annotations:
              summary: "192.168.8.130:9100 /var/lib/rancher: 10% free (local-path volumes)"
          - exp_labels:
              severity: warning
              job: kubernetes-pods
              name: node-exporter
              kubernetes_namespace: monitoring
              instance: 192.168.8.217:9100
              mountpoint: /
            exp_annotations:
              summary: "192.168.8.217:9100 /: 10% free (local-path volumes)"
      - eval_time: 20m
        alertname: LocalPathDiskCritical
        exp_alerts: []

  # Critical: under 5% free for 5 minutes. At 10m the warning (15m) is
  # still pending, so only the critical fires.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.130:9100",mountpoint="/var/lib/rancher"}'
        values: '3x20'
      - series: 'node_filesystem_size_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.130:9100",mountpoint="/var/lib/rancher"}'
        values: '100x20'
      - series: 'node_filesystem_avail_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.130:9100",mountpoint="/"}'
        values: '50x20'
      - series: 'node_filesystem_size_bytes{job="kubernetes-pods",name="node-exporter",kubernetes_namespace="monitoring",instance="192.168.8.130:9100",mountpoint="/"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: LocalPathDiskCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: kubernetes-pods
              name: node-exporter
              kubernetes_namespace: monitoring
              instance: 192.168.8.130:9100
              mountpoint: /var/lib/rancher
            exp_annotations:
              summary: "192.168.8.130:9100 /var/lib/rancher: 3% free (local-path volumes)"
      - eval_time: 10m
        alertname: LocalPathDiskLow
        exp_alerts: []
