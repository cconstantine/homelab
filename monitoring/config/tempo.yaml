# Single-binary Tempo (-target=all), based on smelt's dev-stack config
# (docker/tempo/tempo.yaml). Receives OTLP on 4317 (gRPC) / 4318 (HTTP);
# Grafana queries it on 3200.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

backend_worker:
  compaction:
    block_retention: 336h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
